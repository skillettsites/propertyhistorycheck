name: HMLR CCOD/OCOD monthly ingest

on:
  schedule:
    # CCOD/OCOD published 2nd working day → safe to run on 5th
    - cron: '0 7 5 * *'
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save unzipper csv-parser node-fetch@2
      - name: Ingest CCOD (UK companies) + OCOD (overseas companies)
        env:
          HMLR_API_KEY: ${{ secrets.HMLR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/hmlr-ingest.mjs ccod
          node scripts/hmlr-ingest.mjs ocod
