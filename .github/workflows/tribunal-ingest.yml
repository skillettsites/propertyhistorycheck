name: Tribunal Decisions daily ingest

on:
  schedule:
    # Daily at 07:30 UTC
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: backfill (one-time historical) or incremental (daily)'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - backfill

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # backfill needs ~5 hours at 1 rps for 16,800 decisions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save node-fetch@2
      - name: Run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          node scripts/tribunal-ingest.mjs "$MODE"
